<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PyqHub is Moving → PYQHUB.TECH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta -->
  <meta name="description" content="pyqhubs.in has moved to pyqhub.tech. The official PyqHub website is now available at PYQHUB.TECH. You will be redirected shortly." />
  <meta name="keywords" content="PyqHub, PYQHUB, Previous Year Questions, PYQ, pyqhub.tech, pyqhubs.in" />
  <meta name="author" content="PyqHub" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.pyqhub.tech/" />

  <!-- Open Graph -->
  <meta property="og:title" content="PyqHub is Moving to PYQHUB.TECH" />
  <meta property="og:description" content="We are migrating from pyqhubs.in to pyqhub.tech. You will be redirected automatically." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.pyqhub.tech/" />

  <!-- Redirect after 6 seconds -->
  <meta http-equiv="refresh" content="6; url=https://www.pyqhub.tech/" />

  <style>
    :root {
      --bg: #020617;
      --card: #0b1220;
      --primary: #6366f1;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --glow: rgba(99,102,241,.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #020617 60%);
      color: var(--text);
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 560px;
      background: linear-gradient(180deg, rgba(17,24,39,.9), rgba(2,6,23,.95));
      border-radius: 16px;
      padding: 28px 22px 26px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 24px var(--glow);
      border: 1px solid rgba(99,102,241,.25);
      backdrop-filter: blur(10px);
    }
    .logo { font-weight: 900; letter-spacing: .4px; font-size: 1.9rem; }
    .badge {
      display: inline-block; margin-top: 10px;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(99,102,241,.15);
      border: 1px solid rgba(99,102,241,.35);
      color: #c7d2fe; font-size: .8rem;
    }
    h1 { margin: 18px 0 8px; font-size: 1.45rem; }
    p { color: var(--muted); line-height: 1.6; font-size: .95rem; margin: 8px 0; }
    .url { color: #c7d2fe; font-weight: 600; word-break: break-all; }
    .countdown { margin-top: 14px; font-size: .9rem; color: #c7d2fe; }
    .btn {
      display: inline-block; margin-top: 18px;
      padding: 12px 18px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; text-decoration: none; font-weight: 700;
      box-shadow: 0 10px 28px rgba(99,102,241,.45);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(99,102,241,.6); }
    footer { margin-top: 18px; font-size: .75rem; color: #64748b; }
    @media (max-width: 420px) { .logo{font-size:1.7rem} h1{font-size:1.25rem} }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <div class="logo">PYQHUB</div>
    <div class="badge">Domain Migration</div>

    <h1>We’ve moved to PYQHUB.TECH</h1>
    <p><strong>pyqhubs.in</strong> is being migrated. Our official site is now:</p>
    <p class="url">https://www.pyqhub.tech/</p>

    <div class="countdown">Redirecting in <strong><span id="sec">6</span></strong> seconds…</div>
    <a class="btn" href="https://www.pyqhub.tech/" rel="noopener">Go now</a>

    <footer>© <span id="year"></span> PyqHub. All rights reserved.</footer>
  </main>

  <script>
    // Visual countdown (redirect is handled by meta refresh)
    let s = 6;
    const el = document.getElementById('sec');
    setInterval(() => { if (s > 0) el.textContent = --s; }, 1000);
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
