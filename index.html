<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PyqHub is Moving | PYQHUB.TECH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta -->
  <meta name="description" content="PyqHubs.in is now available on PYQHUB.TECH. We are migrating our services. You will be redirected automatically." />
  <meta name="keywords" content="PyqHub, PYQHUB, Previous Year Questions, PYQ website, pyqhub.tech, pyqhubs.in" />
  <meta name="author" content="PyqHub Team" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="PyqHub is Moving to PYQHUB.TECH" />
  <meta property="og:description" content="We are shifting from pyqhubs.in to pyqhub.tech. You will be redirected shortly." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.pyqhub.tech/" />

  <!-- Auto Redirect -->
  <meta http-equiv="refresh" content="6; url=https://www.pyqhub.tech/" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --primary: #6366f1;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --glow: rgba(99, 102, 241, 0.5);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: linear-gradient(180deg, rgba(17,24,39,0.9), rgba(2,6,23,0.95));
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 25px var(--glow);
      border: 1px solid rgba(99,102,241,0.25);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: white;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(99,102,241,0.15);
      color: #c7d2fe;
      font-size: 0.8rem;
      border: 1px solid rgba(99,102,241,0.35);
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 1.5rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .redirect {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #c7d2fe;
    }

    .btn {
      margin-top: 22px;
      display: inline-block;
      padding: 12px 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(99,102,241,0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(99,102,241,0.6);
    }

    footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.3rem;
      }
      .logo {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">PYQHUB</div>
    <div class="badge">Domain Migration Notice</div>

    <h1>We’ve moved to <br> PYQHUB.TECH 🚀</h1>

    <p>
      <strong>pyqhubs.in</strong> is currently being migrated.  
      Our official and active platform is now:
    </p>

    <p><strong>https://www.pyqhub.tech</strong></p>

    <div class="redirect">
      You will be redirected automatically in 6 seconds...
    </div>

    <a class="btn" href="https://www.pyqhub.tech/">Go to PYQHUB.TECH Now</a>

    <footer>
      © <span id="year"></span> PyqHub. All rights reserved.
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
